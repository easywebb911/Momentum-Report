name: Momentum-Lauf

# Werktags 21:45 UTC — nach Schluss beider Maerkte (Xetra 17:30 MEZ/MESZ,
# NYSE 22:00 MEZ / 21:00 MESZ ... deshalb bewusst spaet). Der Lauf erkennt
# selbst, ob heute der letzte Handelstag des Monats war, und bildet dann
# das neue Ranking; an allen anderen Tagen werden nur Kurse aktualisiert.
on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
    inputs:
      datum:
        description: "Laufdatum JJJJ-MM-TT (leer = heute)"
        required: false
        type: string
      ohne_push:
        description: "Keinen ntfy-Push verschicken"
        required: false
        default: false
        type: boolean
      testpush:
        description: "Zusätzlich einen leisen Probe-Push schicken (prüft die Verdrahtung)"
        required: false
        default: false
        type: boolean

# Laeufe nie parallel und nie abwuergen: ein halb geschriebenes Ranking
# waere schlimmer als ein spaeter Lauf.
concurrency:
  group: daily-momentum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lauf:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Bewusst der ZWEIGNAME, nicht der beim Dispatch eingefrorene SHA:
      # sonst arbeitet ein manuell gestarteter Lauf auf altem Stand und
      # sein Push kollidiert garantiert.
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fehlendes Secret ist NIE ein stiller Rueckfall.
      - name: Push-Einstellung pruefen
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "========================================================================"
            echo "NTFY_TOPIC IST NICHT GESETZT."
            echo "Die Analyse laeuft trotzdem vollstaendig durch, ABER es gibt keine"
            echo "Benachrichtigungen - weder fuer ein neues Monats-Ranking noch fuer"
            echo "einen Fehlschlag. Setzen unter:"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: NTFY_TOPIC   Wert: der ntfy-Themenname"
            echo "========================================================================"
            echo "::warning title=NTFY_TOPIC fehlt::Keine Push-Benachrichtigungen moeglich. Die Analyse ist davon unberuehrt."
          else
            echo "NTFY_TOPIC ist gesetzt."
          fi

      - name: Analyse
        id: analyse
        run: |
          python -m momentum.run \
            ${{ inputs.datum && format('--today {0}', inputs.datum) || '' }} \
            ${{ inputs.ohne_push && '--no-push' || '' }} \
            ${{ inputs.testpush && '--testpush' || '' }}

      # --------------------------------------------------------------
      # Ergebnisse zurueckschreiben. Nur auf main, und mit
      # continue-on-error: ein Push-Konflikt ist KEIN Analyse-Fehler und
      # darf deshalb nicht die Sirene ausloesen.
      # --------------------------------------------------------------
      - name: Ergebnisse zurueckschreiben
        id: push
        if: success() && github.ref_name == 'main'
        continue-on-error: true
        run: |
          set -u
          git config user.name  "momentum-report[bot]"
          git config user.email "momentum-report@users.noreply.github.com"

          git add -A data docs
          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu schreiben."
            exit 0
          fi
          git commit -m "Lauf ${{ github.run_number }}: Kurse und Seiten aktualisiert"

          versuche=5
          wartezeit=5
          for i in $(seq 1 $versuche); do
            # Vor JEDEM Wiederholungsversuch aufraeumen: ein haengengebliebener
            # Rebase aus dem vorigen Versuch wuerde alles Weitere blockieren.
            # Ausgabe unterdrueckt -- "no rebase in progress" ist der
            # Normalfall und wuerde das Protokoll nur zumuellen.
            git rebase --abort >/dev/null 2>&1 || true

            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              echo "Versuch $i: pull --rebase fehlgeschlagen, warte ${wartezeit}s."
              sleep $wartezeit
              wartezeit=$((wartezeit * 2))
              continue
            fi

            if ausgabe=$(git push origin "HEAD:${{ github.ref_name }}" 2>&1); then
              echo "Push erfolgreich im Versuch $i."
              exit 0
            fi
            echo "$ausgabe"

            # Eine Schutzregel des Repositories lehnt IMMER ab -- warten und
            # wiederholen macht das nicht besser, es verbrennt nur Zeit und
            # ueberdeckt im Protokoll den eigentlichen Befund. Also sofort raus.
            case "$ausgabe" in
              *GH013*|*"rule violations"*|*"protected branch"*|*"Required status check"*)
                git rebase --abort >/dev/null 2>&1 || true
                echo "Der Bot darf nicht nach ${{ github.ref_name }} schreiben."
                echo "Das ist eine Schutzregel des Repositories, kein Konflikt --"
                echo "Wiederholen aendert daran nichts. Abhilfe: Settings -> Rules"
                echo "-> Ruleset -> Bypass list -> GitHub Actions eintragen."
                echo "::error title=Vom Repository abgelehnt::Schutzregel auf ${{ github.ref_name }} verbietet dem Bot das Schreiben. Kein Wiederholen sinnvoll -- Bypass fuer GitHub Actions eintragen."
                exit 1 ;;
            esac

            echo "Versuch $i fehlgeschlagen, warte ${wartezeit}s."
            sleep $wartezeit
            wartezeit=$((wartezeit * 2))
          done

          git rebase --abort >/dev/null 2>&1 || true
          echo "::error title=Daten-Push::Nach $versuche Versuchen nicht geschrieben."
          exit 1

      - name: Daten-Push-Konflikt melden (ohne Sirene)
        if: steps.push.outcome == 'failure'
        run: |
          python - <<'PY'
          import os
          from momentum.notify import push_data_conflict
          push_data_conflict(
              "Das Zurueckschreiben nach main hat nicht geklappt. Moegliche "
              "Gruende: ein gleichzeitiger Commit oder eine Schutzregel des "
              "Repositories, die dem Bot das Schreiben verbietet. Welcher der "
              "beiden Faelle vorliegt, steht im Lauf-Protokoll.\n"
              f"Lauf: {os.environ.get('GITHUB_RUN_URL', '')}"
          )
          PY

      # Die Analyse meldet ihren eigenen Fehlschlag selbst -- mit dem echten
      # Grund ("Universum ist Platzhalter") statt eines allgemeinen "Job rot".
      # Dieser Schritt deckt nur die Faelle ab, in denen das Programm gar
      # nicht erst startet (Checkout, Python, pip). Sonst gaebe es zwei Pushes.
      - name: Fehlschlag vor der Analyse melden (mit Sirene)
        if: failure() && steps.analyse.outcome != 'failure'
        run: |
          python - <<'PY'
          import os
          from momentum.notify import push_run_failed
          push_run_failed(
              "Der Lauf ist abgebrochen, BEVOR die Analyse ueberhaupt "
              "gestartet ist (Einrichtung des Laufs).\n"
              f"Lauf: {os.environ.get('GITHUB_RUN_URL', '')}"
          )
          PY

      - name: Lauf-Status ins Protokoll
        if: always()
        run: |
          echo "### Momentum-Lauf ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Analyse: ${{ steps.analyse.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Zurueckschreiben: ${{ steps.push.outcome || 'uebersprungen' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data/status.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/status.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
