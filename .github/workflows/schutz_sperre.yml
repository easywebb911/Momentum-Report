# SCHUTZ-SPERRE -- inzwischen eine reine AMPEL, keine Sperre (siehe
# src/momentum/schutz_sperre.py, Modul-Docstring "WARUM KEINE FREIGABE
# MEHR"): wird rot, wenn ein PR eine geschuetzte Zone (Score/Ranking/
# Stichtag/Konfluenz-Entscheidung/geschuetzte Daten/Golden-Tests/
# Selbstschutz) beruehrt -- OHNE jede Freigabe-Moeglichkeit. Grund: der
# Code dieses Repos (und jeder kuenftige Agent, Auftrag 5) handelt in
# der GitHub-API selbst als `easywebb911` -- eine Freigabe "von
# easywebb911" waere also vom selben Agenten faelschbar, der sie
# prueft. Entscheid: Agenten mergen NIE, Easy entscheidet und merged
# selbst. Rot heisst deshalb "Easys Entscheidung noetig", nicht
# "verboten" -- ein roter Check blockiert ohnehin keinen manuellen
# Merge (kein Ruleset dahinter, siehe SESSION_HANDOVER.md §4 Punkt 14).
#
# Ein PR-Titel, der mit "[Wächter]" beginnt UND eine geschuetzte Zone
# beruehrt, bleibt immer rot -- die Check-Ausgabe weist das zusaetzlich
# ausdruecklich aus.
#
# FAIL-CLOSED: kann dieser Check den Diff nicht lesen, ist er ROT,
# nicht gruen (siehe schutz_sperre.py).
#
# HARTE GRENZE, wie bei jedem Pruef-Baustein dieses Projekts: dieser
# Workflow SCHREIBT NICHTS -- kein Label, kein Kommentar, kein Merge.
# Serverseitig erzwungen durch die Rechte unten (nur `contents: read`,
# `pull-requests: read` -- `issues: read` ENTFALLEN, seit die Freigabe-
# Pruefung ueber Issue-/Label-Ereignisse entfernt wurde) UND durch einen
# statischen Test (tests/unit/test_schutz_sperre.py), der den Quelltext
# von schutz_sperre.py sowohl auf jeden schreibenden Aufruf ALS AUCH auf
# jede verbleibende Freigabe-/Akteur-Logik durchsucht.
#
# KEINE Workflow-Interpolation (weder Eingabefelder noch PR-Text) in
# einer `run:`-Zeile -- dieser Workflow hat gar keine Eingabefelder;
# alles, was das Skript braucht (PR-Nummer, Titel, Basis-/Kopf-SHA),
# liest es selbst aus `GITHUB_EVENT_PATH` bzw. ueber `gh api`, nie aus
# einer Workflow-Interpolation.
name: Schutz-Sperre

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Bewusst ABWEICHEND von der Projekt-Policy "nie abwuergen" (die gilt
  # fuer schreibende Laeufe wie lauf.yml): dieser Check ist rein lesend
  # und bezieht sich je Lauf auf EINEN bestimmten PR-Kopf-Commit --
  # ueberholt ein neuer Push den alten Check-Lauf, ist dessen Ergebnis
  # ohnehin veraltet. Abbrechen statt warten vermeidet nur einen
  # nutzlosen, bereits ueberholten Lauf.
  group: schutz-sperre-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # fetch-depth: 0 -- bewusst die VOLLE Historie: dieser Check liest
      # `git show` gegen Basis- UND Kopf-Commit des PR, ein flacher
      # Checkout haette beide nicht zuverlaessig verfuegbar.
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Kein pip install: schutz_sperre.py ist reine Standardbibliothek.
      # `gh` steht auf den GitHub-Runnern bereits vorinstalliert bereit.
      - name: Geschuetzte Zonen pruefen
        run: python -m momentum.schutz_sperre
