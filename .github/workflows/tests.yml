name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Erzeugte Seiten muessen aktuell sein
        run: |
          # build_pages erzeugt die Methodik-Seite rein aus sources.py --
          # sie wird geprueft, eine Aenderung an den Belegen mit veralteter
          # Seite waere sonst durchgerutscht. docs/konfluenz.html gehoert
          # NICHT mehr hierher: sie traegt seit der Historie-Sektion echte
          # Lauf-Daten (data/konfluenz_historie.json) und wird von
          # build_pages nur noch als Platzhalter angelegt, wenn sie fehlt
          # (wie index.html/evaluation.html) -- ein diff waere hier immer
          # falsch-positiv.
          python -m momentum.build_pages
          for seite in docs/methodik.html; do
            if ! git diff --quiet -- "$seite"; then
              echo "::error::$seite ist nicht auf dem Stand des Codes."
              echo "Bitte 'PYTHONPATH=src python -m momentum.build_pages' laufen lassen und mit committen."
              git --no-pager diff -- "$seite"
              exit 1
            fi
          done
        env:
          PYTHONPATH: src

      - name: Tests ohne Netz
        run: python -m pytest -v

      - name: Design-Check auf 390 px (Browser)
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest tests/design -v
