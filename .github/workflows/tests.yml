name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Methodik-Seite muss aktuell sein
        run: |
          python -m momentum.build_pages
          if ! git diff --quiet -- docs/methodik.html; then
            echo "::error::docs/methodik.html ist nicht auf dem Stand von sources.py."
            echo "Bitte 'PYTHONPATH=src python -m momentum.build_pages' laufen lassen und mit committen."
            git --no-pager diff -- docs/methodik.html
            exit 1
          fi
        env:
          PYTHONPATH: src

      - name: Tests ohne Netz
        run: python -m pytest -v

      - name: Design-Check auf 390 px (Browser)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m pytest tests/design -v
