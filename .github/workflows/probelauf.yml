# WEGWERF-WORKFLOW. Er weist zwei Pfade nach, die im Betrieb noch nie
# gelaufen sind (Zins-Abruf live, Korrekturweg), und wird danach wieder
# entfernt. Deshalb bewusst:
#   * nur workflow_dispatch -- kein Zeitplan, er kommt nie von selbst
#   * contents: read -- er KANN nicht schreiben, auch nicht versehentlich
#   * kein NTFY_TOPIC -- aus der Probe geht kein Push raus
#   * timeout-minutes: 20 -- ein haengender Abruf blockiert nichts
name: Probelauf

on:
  workflow_dispatch:
    inputs:
      datum:
        description: "Laufdatum für Probe A (leer = heute)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: probelauf
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ausgangszustand festhalten
        id: vorher
        run: |
          echo "Arbeitsbaum vor der Probe:"
          git status --porcelain | sed 's/^/  /' || true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          sha256sum data/rankings/de_2026-07.json | tee /tmp/vorher.sha256

      - name: Probe A und B
        run: python tools/probelauf.py ${{ inputs.datum }}

      - name: Arbeitsbaum muss unveraendert sein
        if: always()
        run: |
          # Der eigentliche Beweis, dass die Probe nichts hinterlaesst:
          # dieselbe Pruefsumme wie vorher UND ein leerer git status.
          echo "Pruefsumme der beruehrten Datei:"
          sha256sum -c /tmp/vorher.sha256

          rest="$(git status --porcelain)"
          if [ -n "$rest" ]; then
            echo "$rest" | sed 's/^/  /'
            echo "::error title=Probe hat Spuren hinterlassen::Der Arbeitsbaum ist nicht mehr sauber."
            exit 1
          fi
          echo "git status --porcelain ist leer — nichts hinterlassen."

      - name: Ergebnis ins Protokoll
        if: always()
        run: |
          echo "### Probelauf" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Stand: ${{ steps.vorher.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Probe: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Einzelheiten im Schritt \`Probe A und B\`." >> $GITHUB_STEP_SUMMARY
