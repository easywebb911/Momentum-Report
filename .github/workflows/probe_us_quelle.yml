# =========================================================================
# WEGWERF-PROBE — nach dem Befund wieder loeschen (Rueckbau-PR).
#
# Sie beantwortet EINE Frage, die sich nur auf einem GitHub-Runner
# beantworten laesst: Gibt es fuer den US-Markt eine zweite Kursquelle
# derselben Art wie die deutschen iShares-Bestandslisten -- also eine
# CSV-Datei mit einer Kurs-Spalte?
#
# WARUM NICHT AUS DER BAU-SITZUNG: Der Egress-Proxy dort blockt
# ishares.com vollstaendig (CONNECT tunnel failed, HTTP 403). Und selbst
# ohne Sperre waere die Antwort wertlos: Sandbox-Adressen haben eine
# andere Reputation als GitHub-Runner, und genau von deren Adressen aus
# muesste die Datei spaeter jeden Monat kommen. Der Runner ist der
# einzige Ort, an dem die Frage ueberhaupt richtig gestellt ist.
#
# SIE SCHREIBT NICHTS (contents: read), sie schickt keinen Push, und sie
# aendert an keinem Lauf etwas. Sie holt drei URLs und berichtet, was
# ankam.
# =========================================================================
name: Probe US-Quelle (Wegwerf)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kandidaten abklopfen
        env:
          PYTHONPATH: src
        run: python tools/probe_us_quelle.py
