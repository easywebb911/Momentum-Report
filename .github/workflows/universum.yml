name: Universum aktualisieren

# BEWUSST MANUELL. Es gibt keinen Zeitplan: das Universum darf sich nicht
# unbemerkt unter einem laufenden Ranking wegdrehen. Wer hier auf "Run
# workflow" drueckt, entscheidet sich fuer eine neue Datengrundlage.
on:
  workflow_dispatch:
    inputs:
      markt:
        description: "Welches Universum?"
        required: true
        default: beide
        type: choice
        options: [beide, us, de]
      url_dax:
        description: "Nur falls noetig: CSV-Link der iShares-DAX-Bestandsliste (EXS1)"
        required: false
        type: string
      url_mdax:
        description: "Nur falls noetig: CSV-Link der iShares-MDAX-Bestandsliste (EXS3)"
        required: false
        type: string
      url_tecdax:
        description: "Nur falls noetig: CSV-Link der iShares-TecDAX-Bestandsliste (EXS2)"
        required: false
        type: string

concurrency:
  group: universum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  universum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Leer gelassen greifen die Konstanten aus tools/build_universe.py.
      MOMENTUM_URL_DAX: ${{ inputs.url_dax }}
      MOMENTUM_URL_MDAX: ${{ inputs.url_mdax }}
      MOMENTUM_URL_TECDAX: ${{ inputs.url_tecdax }}

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bricht von sich aus ab, wenn die Anzahl unplausibel ist oder die
      # Kurspruefung zu viele Titel aussortiert. Dann wird NICHTS geschrieben.
      - name: Listen erzeugen und gegen die Kursquelle pruefen
        run: python tools/build_universe.py ${{ inputs.markt }}

      - name: Ergebnis pruefen (Platzhalter muss weg sein)
        if: always()
        run: |
          python - <<'PY'
          from momentum.universe import load_universe
          for pfad in ("universe/universe_us.txt", "universe/universe_de.txt"):
              try:
                  u = load_universe(pfad)
                  print(f"{pfad}: {len(u.entries)} Titel, Stand {u.as_of}, Herkunft {u.origin}")
              except Exception as exc:
                  print(f"{pfad}: noch nicht befuellt ({exc})")
          PY

      # ABSICHTLICH always(): schlaegt EIN Markt fehl, ist der Schritt oben
      # rot -- die Liste des anderen Marktes ist aber fertig geprueft und
      # muss trotzdem ins Repo. Im ersten Lauf ging genau so ein fertiges
      # US-Universum verloren. Geschrieben wird nur, was Plausibilitaets-
      # und Kurspruefung bestanden hat; build_universe.py legt niemals ein
      # Halbergebnis ab.
      - name: Zurueckschreiben
        if: always() && github.ref_name == 'main'
        run: |
          set -u
          git config user.name  "momentum-report[bot]"
          git config user.email "momentum-report@users.noreply.github.com"
          git add -A universe
          if git diff --cached --quiet; then
            echo "Keine Aenderung am Universum."
            exit 0
          fi
          git commit -m "Universum aktualisiert (${{ inputs.markt }}, Lauf ${{ github.run_number }})"

          for i in 1 2 3 4 5; do
            # Ausgabe unterdrueckt: "no rebase in progress" ist der Normalfall.
            git rebase --abort >/dev/null 2>&1 || true

            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              sleep $((5 * i))
              continue
            fi

            if ausgabe=$(git push origin "HEAD:${{ github.ref_name }}" 2>&1); then
              echo "Geschrieben im Versuch $i."
              exit 0
            fi
            echo "$ausgabe"

            # Eine Schutzregel lehnt IMMER ab -- Wiederholen verbrennt nur Zeit
            # und ueberdeckt im Protokoll den eigentlichen Befund.
            case "$ausgabe" in
              *GH013*|*"rule violations"*|*"protected branch"*|*"Required status check"*)
                git rebase --abort >/dev/null 2>&1 || true
                echo "Der Bot darf nicht nach ${{ github.ref_name }} schreiben."
                echo "Das ist eine Schutzregel des Repositories, kein Konflikt --"
                echo "Wiederholen aendert daran nichts. Abhilfe: Settings -> Rules"
                echo "-> Ruleset -> Bypass list -> GitHub Actions eintragen."
                echo "::error title=Vom Repository abgelehnt::Schutzregel auf ${{ github.ref_name }} verbietet dem Bot das Schreiben. Die geprueften Listen liegen fertig im Lauf, konnten aber nicht abgelegt werden."
                exit 1 ;;
            esac

            sleep $((5 * i))
          done
          git rebase --abort >/dev/null 2>&1 || true
          echo "::error title=Universum-Push::nicht geschrieben"
          exit 1

      - name: Hinweis
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Danach einmal den Workflow **Momentum-Lauf** starten — er bildet" >> $GITHUB_STEP_SUMMARY
          echo "dann rueckwirkend das Ranking zum letzten Handelstag Juli 2026." >> $GITHUB_STEP_SUMMARY
