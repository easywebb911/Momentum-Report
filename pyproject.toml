[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-report"
version = "0.1.0"
description = "Momentum-Report — Anwendungs-Werkzeug auf belegter Wissenschaft"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "network: braucht echten Zugriff auf die Kursquelle (laeuft nicht im Standardlauf)",
  "browser: braucht einen echten Browser (Playwright)",
]
addopts = "-q -m 'not network'"
